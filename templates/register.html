{% extends "base.html" %}

{% block title %}Student Registration | TechnoVault - Hari University{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">

    <div class="text-center space-y-1">
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Join Technoverse Club</h1>
        <p class="text-xs text-slate-400">Hari University Student Enrollment & Repository Access</p>
    </div>

    <div class="bg-slate-900 rounded-2xl border border-slate-800 p-6 sm:p-8 shadow-xl">
        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Full Name *</label>
                <input type="text" name="full_name" required placeholder="e.g. Rahul Verma"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Username *</label>
                    <input type="text" name="username" required placeholder="rahul_v"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Student Roll ID *</label>
                    <input type="text" name="student_id" required placeholder="HU-2024-CSE-105"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Department / Branch *</label>
                <input type="text" name="department" required placeholder="Computer Science & Engineering"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Email Address *</label>
                <input type="email" name="email" required placeholder="student@hariuniv.edu.in"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Account Password *</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
            </div>

            <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-cyan-600/30 transition">
                Complete Registration
            </button>
        </form>

        <div class="text-center text-xs text-slate-400 pt-4 border-t border-slate-800 mt-4">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-cyan-400 font-semibold hover:underline">Sign In here</a>
        </div>
    </div>

</div>
{% endblock %}
